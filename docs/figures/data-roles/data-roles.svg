<!DOCTYPE svg PUBLIC "-//W3C//DTD SVG 1.1//EN" "http://www.w3.org/Graphics/SVG/1.1/DTD/svg11.dtd">
<svg xmlns="http://www.w3.org/2000/svg" style="background: #ffffff; background-color: light-dark(#ffffff, #121212); color-scheme: light dark;" xmlns:xlink="http://www.w3.org/1999/xlink" version="1.1" width="1162px" height="962px" viewBox="0 0 1162 962" id="ge-svg-ijlXfkDp9bFzOkKms_0l"><style type="text/css">@supports (color: light-dark(#000, #fff)) { #ge-svg-ijlXfkDp9bFzOkKms_0l { --ge-adaptive-fg: light-dark(#000000, var(--ge-light-color, #ffffff)); } }</style><defs/><rect fill="#ffffff" width="100%" height="100%" x="0" y="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><g><g data-cell-id="0"><g data-cell-id="1"><g data-cell-id="title"><g transform="translate(0.5,0.5)"><rect x="10" y="0" width="1140" height="55" rx="8.25" ry="8.25" fill="#ffffff" stroke="#ffffff" pointer-events="all" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18)); stroke: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/></g><g><g fill="#1f3443" font-family="Arial" text-anchor="middle" font-size="30px" style="fill: light-dark(rgb(31, 52, 67), rgb(180, 198, 210));"><text x="580" y="41.5">Where data can influence a decision</text></g></g></g><g data-cell-id="input"><g transform="translate(0.5,0.5)"><rect x="400" y="80" width="340" height="90" rx="13.5" ry="13.5" fill="#e8f1f7" stroke="#27617f" pointer-events="all" style="fill: light-dark(rgb(232, 241, 247), rgb(25, 33, 38)); stroke: light-dark(rgb(39, 97, 127), rgb(122, 172, 198));"/></g><g><g fill="#1f3443" font-family="Arial" text-anchor="middle" font-size="19px" style="fill: light-dark(rgb(31, 52, 67), rgb(180, 198, 210));"><text x="570" y="122">Historical dataset</text><text x="570" y="145">569 records · 30 features</text></g></g></g><g data-cell-id="development"><g transform="translate(0.5,0.5)"><rect x="0" y="225" width="710" height="85" rx="12.75" ry="12.75" fill="#dcece7" stroke="#386c5c" pointer-events="all" style="fill: light-dark(rgb(220, 236, 231), rgb(27, 41, 37)); stroke: light-dark(rgb(56, 108, 92), rgb(120, 165, 151));"/></g><g><g fill="#1f3443" font-family="Arial" text-anchor="middle" font-size="19px" style="fill: light-dark(rgb(31, 52, 67), rgb(180, 198, 210));"><text x="355" y="264.5">455 development records</text><text x="355" y="287.5">All model and threshold choices stay here</text></g></g></g><g data-cell-id="holdout"><g transform="translate(0.5,0.5)"><rect x="810" y="225" width="350" height="105" rx="15.75" ry="15.75" fill="#fff0dc" stroke="#a66b28" pointer-events="all" style="fill: light-dark(rgb(255, 240, 220), rgb(41, 28, 11)); stroke: light-dark(rgb(166, 107, 40), rgb(183, 132, 74));"/></g><g><g fill="#1f3443" font-family="Arial" text-anchor="middle" font-size="19px" style="fill: light-dark(rgb(31, 52, 67), rgb(180, 198, 210));"><text x="985" y="274.5">114 historical holdout records</text><text x="985" y="297.5">Already inspected in version 0.1</text></g></g></g><g data-cell-id="nested"><g transform="translate(0.5,0.5)"><rect x="0" y="385" width="335" height="155" rx="23.25" ry="23.25" fill="#e8f1f7" stroke="#27617f" pointer-events="all" style="fill: light-dark(rgb(232, 241, 247), rgb(25, 33, 38)); stroke: light-dark(rgb(39, 97, 127), rgb(122, 172, 198));"/></g><g><g fill="#1f3443" font-family="Arial" text-anchor="middle" font-size="19px" style="fill: light-dark(rgb(31, 52, 67), rgb(180, 198, 210));"><text x="167.5" y="436.5">Repeated nested assessment</text><text x="167.5" y="459.5">4 outer folds × 2 repeats</text><text x="167.5" y="482.5">3 inner folds tune only inside</text><text x="167.5" y="505.5">each outer training partition</text></g></g></g><g data-cell-id="refit"><g transform="translate(0.5,0.5)"><rect x="375" y="385" width="335" height="155" rx="23.25" ry="23.25" fill="#dcece7" stroke="#386c5c" pointer-events="all" style="fill: light-dark(rgb(220, 236, 231), rgb(27, 41, 37)); stroke: light-dark(rgb(56, 108, 92), rgb(120, 165, 151));"/></g><g><g fill="#1f3443" font-family="Arial" text-anchor="middle" font-size="19px" style="fill: light-dark(rgb(31, 52, 67), rgb(180, 198, 210));"><text x="542.5" y="436.5">Final model fitting</text><text x="542.5" y="459.5">5-fold tuning on all 455</text><text x="542.5" y="482.5">development records</text><text x="542.5" y="505.5">Refit both learned models</text></g></g></g><g data-cell-id="outer"><g transform="translate(0.5,0.5)"><rect x="0" y="620" width="335" height="175" rx="26.25" ry="26.25" fill="#e8f1f7" stroke="#27617f" pointer-events="all" style="fill: light-dark(rgb(232, 241, 247), rgb(25, 33, 38)); stroke: light-dark(rgb(39, 97, 127), rgb(122, 172, 198));"/></g><g><g fill="#1f3443" font-family="Arial" text-anchor="middle" font-size="19px" style="fill: light-dark(rgb(31, 52, 67), rgb(180, 198, 210));"><text x="167.5" y="658.5">Outputs from the outer fits</text><text x="167.5" y="681.5">8 fold scores per model</text><text x="167.5" y="704.5">Fixed 0.5 classification cutoff</text><text x="167.5" y="727.5">2 predictions per record, each</text><text x="167.5" y="750.5">excluded from fitting/tuning</text><text x="167.5" y="773.5">Average the 2 predictions</text></g></g></g><g data-cell-id="threshold"><g transform="translate(0.5,0.5)"><rect x="375" y="620" width="335" height="175" rx="26.25" ry="26.25" fill="#dcece7" stroke="#386c5c" pointer-events="all" style="fill: light-dark(rgb(220, 236, 231), rgb(27, 41, 37)); stroke: light-dark(rgb(56, 108, 92), rgb(120, 165, 151));"/></g><g><g fill="#1f3443" font-family="Arial" text-anchor="middle" font-size="19px" style="fill: light-dark(rgb(31, 52, 67), rgb(180, 198, 210));"><text x="542.5" y="670">Threshold development</text><text x="542.5" y="693">Fixed cutoff grid searched</text><text x="542.5" y="716">on averaged cross-fitted</text><text x="542.5" y="739">probabilities</text><text x="542.5" y="762">Loss uses development labels</text></g></g></g><g data-cell-id="historical"><g transform="translate(0.5,0.5)"><rect x="810" y="555" width="350" height="175" rx="26.25" ry="26.25" fill="#fff0dc" stroke="#a66b28" pointer-events="all" style="fill: light-dark(rgb(255, 240, 220), rgb(41, 28, 11)); stroke: light-dark(rgb(166, 107, 40), rgb(183, 132, 74));"/></g><g><g fill="#1f3443" font-family="Arial" text-anchor="middle" font-size="19px" style="fill: light-dark(rgb(31, 52, 67), rgb(180, 198, 210));"><text x="985" y="616.5">Historical evaluation</text><text x="985" y="639.5">Apply final models and</text><text x="985" y="662.5">development-selected cutoffs</text><text x="985" y="685.5">Descriptive replication only</text></g></g></g><g data-cell-id="limits"><g transform="translate(0.5,0.5)"><rect x="0" y="865" width="1160" height="95" rx="14.25" ry="14.25" fill="#f3f5f7" stroke="#8195a3" pointer-events="all" style="fill: light-dark(rgb(243, 245, 247), rgb(25, 27, 28)); stroke: light-dark(rgb(129, 149, 163), rgb(97, 114, 126));"/></g><g><g fill="#1f3443" font-family="Arial" text-anchor="middle" font-size="18px" style="fill: light-dark(rgb(31, 52, 67), rgb(180, 198, 210));"><text x="580" y="898.5">Interpretation boundaries</text><text x="580" y="920.5">Fold variability is not a confidence interval. Minimized threshold loss is tuning loss.</text><text x="580" y="942.5">The inspected holdout provides no fresh blind validation; it never feeds back into scripted choices.</text></g></g></g><g data-cell-id="split-development"><g><path d="M 570 170 L 570 197.5 L 355 197.5 L 355 214.76" fill="none" stroke="#506c7b" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(80, 108, 123), rgb(128, 152, 165));"/><path d="M 355 222.76 L 351 214.76 L 359 214.76 Z" fill="#506c7b" stroke="#506c7b" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(80, 108, 123), rgb(128, 152, 165)); stroke: light-dark(rgb(80, 108, 123), rgb(128, 152, 165));"/></g></g><g data-cell-id="split-holdout"><g><path d="M 740 125 L 985 125 L 985 214.76" fill="none" stroke="#506c7b" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(80, 108, 123), rgb(128, 152, 165));"/><path d="M 985 222.76 L 981 214.76 L 989 214.76 Z" fill="#506c7b" stroke="#506c7b" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(80, 108, 123), rgb(128, 152, 165)); stroke: light-dark(rgb(80, 108, 123), rgb(128, 152, 165));"/></g></g><g data-cell-id="development-nested"><g><path d="M 355 310 L 355 347.5 L 167.5 347.5 L 167.5 374.76" fill="none" stroke="#506c7b" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(80, 108, 123), rgb(128, 152, 165));"/><path d="M 167.5 382.76 L 163.5 374.76 L 171.5 374.76 Z" fill="#506c7b" stroke="#506c7b" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(80, 108, 123), rgb(128, 152, 165)); stroke: light-dark(rgb(80, 108, 123), rgb(128, 152, 165));"/></g></g><g data-cell-id="development-refit"><g><path d="M 355 310 L 355 347.5 L 542.5 347.5 L 542.5 374.76" fill="none" stroke="#506c7b" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(80, 108, 123), rgb(128, 152, 165));"/><path d="M 542.5 382.76 L 538.5 374.76 L 546.5 374.76 Z" fill="#506c7b" stroke="#506c7b" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(80, 108, 123), rgb(128, 152, 165)); stroke: light-dark(rgb(80, 108, 123), rgb(128, 152, 165));"/></g></g><g data-cell-id="nested-outputs"><g><path d="M 167.5 540 L 167.5 609.76" fill="none" stroke="#506c7b" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(80, 108, 123), rgb(128, 152, 165));"/><path d="M 167.5 617.76 L 163.5 609.76 L 171.5 609.76 Z" fill="#506c7b" stroke="#506c7b" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(80, 108, 123), rgb(128, 152, 165)); stroke: light-dark(rgb(80, 108, 123), rgb(128, 152, 165));"/></g></g><g data-cell-id="crossfit-threshold"><g><path d="M 335 707.5 L 364.76 707.5" fill="none" stroke="#506c7b" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(80, 108, 123), rgb(128, 152, 165));"/><path d="M 372.76 707.5 L 364.76 711.5 L 364.76 703.5 Z" fill="#506c7b" stroke="#506c7b" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(80, 108, 123), rgb(128, 152, 165)); stroke: light-dark(rgb(80, 108, 123), rgb(128, 152, 165));"/></g></g><g data-cell-id="refit-evaluate"><g><path d="M 710 462.5 L 760 462.5 L 760 590 L 799.76 590" fill="none" stroke="#506c7b" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(80, 108, 123), rgb(128, 152, 165));"/><path d="M 807.76 590 L 799.76 594 L 799.76 586 Z" fill="#506c7b" stroke="#506c7b" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(80, 108, 123), rgb(128, 152, 165)); stroke: light-dark(rgb(80, 108, 123), rgb(128, 152, 165));"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="16px" style="fill: var(--ge-adaptive-fg, #000000);"><rect fill="#ffffff" stroke="none" x="712" y="518" width="98" height="20" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="760" y="533.5">Fitted models</text></g></g></g><g data-cell-id="threshold-evaluate"><g><path d="M 710 707.5 L 760 707.5 L 760 695 L 799.76 695" fill="none" stroke="#506c7b" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(80, 108, 123), rgb(128, 152, 165));"/><path d="M 807.76 695 L 799.76 699 L 799.76 691 Z" fill="#506c7b" stroke="#506c7b" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(80, 108, 123), rgb(128, 152, 165)); stroke: light-dark(rgb(80, 108, 123), rgb(128, 152, 165));"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="16px" style="fill: var(--ge-adaptive-fg, #000000);"><rect fill="#ffffff" stroke="none" x="703" y="693" width="116" height="20" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="760" y="708.5">Selected cutoffs</text></g></g></g><g data-cell-id="holdout-evaluate"><g><path d="M 985 330 L 985 544.76" fill="none" stroke="#506c7b" stroke-width="2" stroke-miterlimit="10" pointer-events="stroke" style="stroke: light-dark(rgb(80, 108, 123), rgb(128, 152, 165));"/><path d="M 985 552.76 L 981 544.76 L 989 544.76 Z" fill="#506c7b" stroke="#506c7b" stroke-width="2" stroke-miterlimit="10" pointer-events="all" style="fill: light-dark(rgb(80, 108, 123), rgb(128, 152, 165)); stroke: light-dark(rgb(80, 108, 123), rgb(128, 152, 165));"/></g><g><g fill="#000000" font-family="Helvetica" text-anchor="middle" font-size="16px" style="fill: var(--ge-adaptive-fg, #000000);"><rect fill="#ffffff" stroke="none" x="930" y="434" width="111" height="20" stroke-width="0" style="fill: light-dark(rgb(255, 255, 255), rgb(18, 18, 18));"/><text x="985" y="450">Evaluation only</text></g></g></g></g></g></g></svg>